name: Garmin Daily Sync

on:
  workflow_dispatch:

  schedule:
    # UTC 21:00 = 日本时间次日 06:00
    - cron: "0 21 * * *"

permissions:
  contents: write

concurrency:
  group: garmin-daily-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sync Garmin data
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GARMIN_TIMEZONE: Asia/Tokyo
        run: |
          python src/sync.py
          python src/export_csv.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data database/garmin.db summary.csv
          git diff --cached --quiet || git commit -m "Auto update Garmin data"
          git push
